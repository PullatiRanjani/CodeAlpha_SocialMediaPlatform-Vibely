{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · Vibely</title><link rel="icon" href="{% static 'img/vibely-mark.svg' %}"><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body class="auth-body"><main class="auth-layout"><section class="auth-brand-panel"><img src="{% static 'img/vibely-mark.svg' %}" alt="Vibely"><div><span>Vibely</span><p>Share moments. Find your people. Feel the vibe.</p></div></section><section class="auth-card"><div class="auth-heading"><span class="eyebrow">Welcome back</span><h1>Log in to Vibely</h1><p>Your people are waiting.</p></div><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for f in form %}<div class="settings-field"><label>{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}<button class="primary-wide" type="submit">Log in</button></form><p class="auth-switch">New to Vibely? <a href="{% url 'register' %}">Create an account</a></p></section></main></body></html>
