{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Vibely</title><link rel="icon" href="{% static 'img/vibely-mark.svg' %}"><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body class="auth-body"><main class="auth-layout"><section class="auth-brand-panel"><img src="{% static 'img/vibely-mark.svg' %}" alt="Vibely"><div><span>Vibely</span><p>Your new social space for real moments and real people.</p></div></section><section class="auth-card"><div class="auth-heading"><span class="eyebrow">Create your account</span><h1>Join Vibely</h1><p>Set up your profile and start sharing.</p></div><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for f in form %}<div class="settings-field"><label>{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}<button class="primary-wide" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p></section></main></body></html>
